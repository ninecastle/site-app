name: Build apps

# main 브랜치에 올리거나, Actions 탭에서 "Run workflow"를 누르면
# 안드로이드 APK + 윈도우 설치파일 + 맥 dmg 를 만들어 Releases 에 올립니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: |
          NAME=$(python3 -c "import json;d=json.load(open('site.json'));print(d.get('fileName') or 'app')")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/${NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build desktop app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg

  # 아이폰 앱은 서명 없이 설치 파일을 만들 수 없어서, 여기서는 "빌드가 되는지"만 확인합니다.
  # 실제 설치는 맥의 Xcode 에서 ios/SiteApp.xcodeproj 를 열어 진행하세요 (README 참고).
  ios-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          xcodebuild -version
          xcodebuild -project SiteApp.xcodeproj -target SiteApp -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build | tail -30
          test ${PIPESTATUS[0]} -eq 0

  release:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: artifacts/*
