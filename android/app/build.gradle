plugins {
    id 'com.android.application'
}

// 사이트 주소·앱 이름은 프로젝트 맨 위의 site.json 하나에서 읽어옵니다.
def site = new groovy.json.JsonSlurper().parse(rootProject.file('../site.json'))

android {
    namespace 'com.siteapp.wrapper'
    compileSdk 35

    defaultConfig {
        applicationId site.androidId ?: 'com.siteapp.wrapper'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        resValue 'string', 'app_name', site.name
        def themeHex = (site.themeColor ?: '#000000').replace('#', '')
        def lum = (0.299 * Integer.parseInt(themeHex.substring(0, 2), 16)
                 + 0.587 * Integer.parseInt(themeHex.substring(2, 4), 16)
                 + 0.114 * Integer.parseInt(themeHex.substring(4, 6), 16)) / 255
        resValue 'color', 'theme_color', '#' + themeHex
        // 밝은 배경이면 상태바 아이콘을 어둡게
        resValue 'bool', 'light_status_bar', (lum > 0.5).toString()
        buildConfigField 'String', 'START_URL', "\"${site.url}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // 테스트용: 별도 키 없이 설치할 수 있게 디버그 키로 서명
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1' // 카메라 사진 저장용 FileProvider
    implementation 'androidx.webkit:webkit:1.12.1' // 웹뷰 X-Requested-With 헤더 끄기 (구글 로그인)
}
